name: Auto Format Code

on:
  push:
    branches: [ main, master ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier and Java Plugin
        run: |
          npm install prettier prettier-plugin-java

      - name: Run Prettier Formatter
        run: |
          npx prettier --write "**/*.java" || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format pushed code"
